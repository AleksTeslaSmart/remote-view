<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote View</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1b1d22; --muted: #6b7280;
    --border: #e2e4e9; --accent: #2563eb; --accent-text: #ffffff;
    --danger: #dc2626; --ok: #16a34a; --shadow: 0 8px 30px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111318; --card: #1b1e25; --text: #eceef2; --muted: #9aa1ad;
      --border: #2c3039; --accent: #3b82f6; --shadow: 0 8px 30px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 24px 16px 32px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  select {
    font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow);
  }
  .label { color: var(--muted); font-size: 14px; margin-bottom: 6px; }
  .id-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .my-id { font-size: 36px; font-weight: 700; letter-spacing: 2px; font-variant-numeric: tabular-nums; }
  .status { font-size: 14px; color: var(--muted); margin-top: 8px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--ok); }
  .dot.err { background: var(--danger); }
  input {
    width: 100%; font: inherit; font-size: 22px; letter-spacing: 2px; padding: 12px 14px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 12px 18px;
    background: var(--accent); color: var(--accent-text); cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button.danger { background: var(--danger); color: #fff; }
  button.small { padding: 6px 12px; font-size: 14px; }
  .full { width: 100%; margin-top: 12px; }
  .msg { margin-top: 10px; font-size: 14px; min-height: 20px; }
  .msg.err { color: var(--danger); }
  .hint { color: var(--muted); font-size: 13px; margin-top: 14px; }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none;
    align-items: center; justify-content: center; padding: 16px; z-index: 10;
  }
  .overlay.show { display: flex; }
  .modal { background: var(--card); border-radius: 14px; padding: 22px; max-width: 400px; width: 100%; box-shadow: var(--shadow); }
  .modal h2 { margin: 0 0 8px; font-size: 18px; }
  .modal p { margin: 0 0 18px; color: var(--muted); }
  .modal .btns { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

  .banner {
    position: fixed; top: 0; left: 0; right: 0; display: none; z-index: 5;
    background: var(--danger); color: #fff; padding: 10px 16px;
    align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; font-weight: 600;
  }
  .banner.show { display: flex; }
  .banner button { background: #fff; color: var(--danger); }

  .viewer { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; z-index: 8; }
  .viewer.show { display: flex; }
  .viewer-bar {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    background: #15171c; color: #eee; font-size: 14px; flex-wrap: wrap;
  }
  .viewer-bar .grow { flex: 1; min-width: 0; }
  .viewer-bar .secondary { color: #eee; border-color: #444; }
  .video-box { position: relative; flex: 1; min-height: 0; display: flex; }
  .viewer video { flex: 1; min-height: 0; width: 100%; object-fit: contain; background: #000; }
  .video-wait {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #bbb; font-size: 16px; pointer-events: none;
  }
  .video-wait.hide { display: none; }
  .stats { font: 12px/1.3 ui-monospace, Consolas, monospace; opacity: .75; font-weight: 400; }
</style>
</head>
<body>

<div class="banner" id="banner">
  <span id="bannerText"></span>
  <span class="stats" id="hostStats"></span>
  <button class="small" id="stopShareBtn" data-i18n="stop"></button>
</div>

<div class="wrap">
  <header>
    <h1 data-i18n="h1"></h1>
    <select id="langSelect" aria-label="Language"></select>
  </header>

  <div class="card">
    <div class="label" data-i18n="yourId"></div>
    <div class="id-row">
      <div class="my-id" id="myId">— — —</div>
      <button class="secondary small" id="copyBtn" data-i18n="copy" disabled></button>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText"></span></div>
  </div>

  <div class="card">
    <div class="label" data-i18n="partnerId"></div>
    <input id="targetInput" inputmode="numeric" autocomplete="off" placeholder="123 456 789" maxlength="11">
    <button class="full" id="connectBtn" data-i18n="view" disabled></button>
    <div class="msg" id="connectMsg"></div>
    <div class="hint" data-i18n="hint"></div>
  </div>
</div>

<div class="overlay" id="askOverlay">
  <div class="modal">
    <h2 data-i18n="askTitle"></h2>
    <p id="askText"></p>
    <div class="btns">
      <button class="secondary" id="rejectBtn" data-i18n="reject"></button>
      <button id="acceptBtn" data-i18n="allow"></button>
    </div>
  </div>
</div>

<div class="viewer" id="viewer">
  <div class="viewer-bar">
    <span class="grow" id="viewerTitle"></span>
    <span class="stats" id="viewStats"></span>
    <button class="secondary small" id="fsBtn" data-i18n="fullscreen"></button>
    <button class="danger small" id="disconnectBtn" data-i18n="disconnect"></button>
  </div>
  <div class="video-box">
    <video id="remoteVideo" autoplay playsinline muted></video>
    <div class="video-wait" id="videoWait" data-i18n="videoConnecting"></div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
  // ---- Настройки ----
  const PREFIX = 'rview-';          // пространство имён в PeerJS Cloud, пользователю не показывается
  const REQUEST_TIMEOUT_MS = 60000; // сколько ждём ответа хоста
  const ICE_SERVERS = [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
  ];
  // TURN-сервер Metered (бесплатный тариф 500 МБ/мес, без перерасхода — при исчерпании просто перестаёт работать).
  // Ключ в ссылке публичный по задумке Metered: он только выдаёт пароли к TURN.
  // Если Metered недоступен — работаем только через STUN.
  const TURN_ENDPOINT = 'https://aleksteslasmartremoteview.metered.live/api/v1/turn/credentials?apiKey=cf2d5c199b605e70820d83493842a89a088f';
  const VIDEO_TIMEOUT_MS = 20000; // если за это время не пришёл ни один кадр — сообщаем об ошибке

  const $ = id => document.getElementById(id);
  const fmt = id => id.replace(/(\d{3})(?=\d)/g, '$1 ');
  const digits = s => (s || '').replace(/\D/g, '');
  const store = {
    get: k => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  };

  // =========================================================
  //                        ЯЗЫКИ
  // =========================================================
  const I18N = window.I18N;
  const LANGS = Object.keys(I18N);
  function detectLang() {
    const saved = store.get('rview-lang');
    if (saved && I18N[saved]) return saved;
    for (const l of navigator.languages || [navigator.language || 'en']) {
      const code = l.toLowerCase().split('-')[0];
      if (I18N[code]) return code;
    }
    return 'en';
  }
  let lang = detectLang();
  const t = (key, params = {}) =>
    (I18N[lang][key] || I18N.en[key] || key).replace(/\{(\w+)\}/g, (_, p) => params[p] ?? '');

  // Динамические тексты храним как ключи, чтобы перерисовать при смене языка
  let statusState = { key: 'connecting', kind: '' };
  let msgState = { key: '', err: false };
  let askParams = {}, bannerParams = {}, viewerParams = {};

  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t('title');
    document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
    $('langSelect').setAttribute('aria-label', t('lang'));
    $('statusText').textContent = t(statusState.key);
    $('connectMsg').textContent = msgState.key ? t(msgState.key) : '';
    $('askText').textContent = t('askText', askParams);
    $('bannerText').textContent = t('sharing', bannerParams);
    $('viewerTitle').textContent = t('screenOf', viewerParams);
  }

  LANGS.forEach(code => {
    const o = document.createElement('option');
    o.value = code; o.textContent = I18N[code].name;
    $('langSelect').appendChild(o);
  });
  $('langSelect').value = lang;
  $('langSelect').onchange = e => { lang = e.target.value; store.set('rview-lang', lang); applyLang(); };

  function setStatus(key, kind) {
    statusState = { key, kind: kind || '' };
    $('statusText').textContent = t(key);
    $('dot').className = 'dot' + (kind ? ' ' + kind : '');
  }
  function setMsg(key, isErr) {
    msgState = { key: key || '', err: !!isErr };
    $('connectMsg').textContent = key ? t(key) : '';
    $('connectMsg').className = 'msg' + (isErr ? ' err' : '');
  }

  // =========================================================
  //                   СЕРВЕР СИГНАЛИЗАЦИИ
  // =========================================================
  let iceServers = ICE_SERVERS;
  async function loadIceServers() {
    if (!TURN_ENDPOINT) return ICE_SERVERS;
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 4000);
      const r = await fetch(TURN_ENDPOINT, { signal: ctrl.signal });
      clearTimeout(timer);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const list = await r.json();
      return Array.isArray(list) && list.length ? ICE_SERVERS.concat(list) : ICE_SERVERS;
    } catch (e) {
      console.warn('TURN unavailable, using STUN only', e);
      return ICE_SERVERS;
    }
  }

  let peer = null;
  let myId = null;

  // Состояние хоста
  let hostConn = null, hostCall = null, hostStream = null;
  const rejectCount = {};   // защита от спама запросами

  // Состояние зрителя
  let viewConn = null, viewCall = null, viewTarget = null, viewTimer = null;

  function newId() {
    let s = String(1 + Math.floor(Math.random() * 9));
    for (let i = 0; i < 8; i++) s += Math.floor(Math.random() * 10);
    return s;
  }

  function start(id, attempt = 0) {
    myId = id;
    $('myId').textContent = fmt(id);
    setStatus('connecting');
    // ?relay=1 в ссылке — принудительно только через TURN (для проверки)
    const relayOnly = new URLSearchParams(location.search).has('relay');
    peer = new Peer(PREFIX + id, { config: { iceServers, iceTransportPolicy: relayOnly ? 'relay' : 'all' } });
    const p = peer;

    p.on('open', () => {
      store.set('rview-id', id);
      setStatus('ready', 'on');
      $('copyBtn').disabled = false;
      $('connectBtn').disabled = false;
    });

    p.on('error', err => {
      if (err.type === 'unavailable-id') {
        p.destroy();
        // После перезагрузки страницы сервер ещё пару секунд держит старый ID — пробуем его ещё раз
        if (attempt === 0 && id === store.get('rview-id')) setTimeout(() => start(id, 1), 3000);
        else if (attempt < 5) start(newId(), attempt + 1);
        else setStatus('noId', 'err');
        return;
      }
      if (err.type === 'peer-unavailable') { failView('idOffline'); return; }
      if (['network', 'server-error', 'socket-error'].includes(err.type)) { setStatus('offline', 'err'); return; }
      console.warn('peer error', err);
    });

    p.on('disconnected', () => {
      if (p.destroyed || p !== peer) return; // это мы сами закрыли его при смене ID
      setStatus('offline', 'err');
      setTimeout(() => { if (p === peer && !p.destroyed && p.disconnected) p.reconnect(); }, 2000);
    });

    p.on('connection', onIncomingConnection);
    p.on('call', onIncomingCall);
  }

  // =========================================================
  //                        ХОСТ
  // =========================================================
  function onIncomingConnection(conn) {
    const fromId = conn.peer.startsWith(PREFIX) ? conn.peer.slice(PREFIX.length) : null;
    if (!fromId) { conn.close(); return; }

    conn.on('open', () => {
      conn.on('data', msg => {
        if (!msg || typeof msg !== 'object') return;
        if (msg.type === 'request') handleRequest(conn, fromId);
        else if (msg.type === 'bye' && conn === hostConn) endHosting();
      });
    });
    conn.on('close', () => { if (conn === hostConn) endHosting(); });
  }

  function handleRequest(conn, fromId) {
    if ((rejectCount[fromId] || 0) >= 3) { conn.send({ type: 'rejected' }); return; }
    if (hostConn || viewConn) { conn.send({ type: 'busy' }); return; }

    hostConn = conn;
    askParams = { id: fmt(fromId) };
    $('askText').textContent = t('askText', askParams);
    $('askOverlay').classList.add('show');
  }

  async function acceptRequest() {
    $('askOverlay').classList.remove('show');
    const conn = hostConn;
    if (!conn) return;

    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
      conn.send({ type: 'error', code: 'noShareRemote' });
      alert(t('noShareLocal'));
      endHosting();
      return;
    }

    try {
      hostStream = await navigator.mediaDevices.getDisplayMedia({
        video: { frameRate: { ideal: 30, max: 30 } }, audio: false
      });
    } catch (e) {
      conn.send({ type: 'error', code: 'noPick' });
      endHosting();
      return;
    }
    if (conn !== hostConn) { stopStream(); return; } // зритель ушёл, пока выбирали экран

    conn.send({ type: 'accepted' });
    hostCall = peer.call(conn.peer, hostStream);
    const call = hostCall;
    call.on('close', () => { if (call === hostCall) endHosting(); });
    watchIce(call, () => { if (call === hostCall) endHosting(); });
    stopHostStats = startStats(call, $('hostStats'), 'out');

    // Пользователь нажал «Прекратить доступ» в браузере
    hostStream.getVideoTracks()[0].addEventListener('ended', endHosting);

    bannerParams = { id: fmt(conn.peer.slice(PREFIX.length)) };
    $('bannerText').textContent = t('sharing', bannerParams);
    $('banner').classList.add('show');
  }

  function rejectRequest() {
    $('askOverlay').classList.remove('show');
    if (hostConn) {
      const fromId = hostConn.peer.slice(PREFIX.length);
      rejectCount[fromId] = (rejectCount[fromId] || 0) + 1;
      try { hostConn.send({ type: 'rejected' }); } catch {}
      const c = hostConn;
      hostConn = null;
      setTimeout(() => c.close(), 500);
    }
  }

  function stopStream() {
    if (hostStream) hostStream.getTracks().forEach(tr => tr.stop());
    hostStream = null;
  }

  function endHosting() {
    $('askOverlay').classList.remove('show');
    $('banner').classList.remove('show');
    stopHostStats(); stopHostStats = () => {};
    stopStream();
    const call = hostCall, conn = hostConn;
    hostCall = null; hostConn = null;
    if (call) try { call.close(); } catch {}
    if (conn) { try { conn.send({ type: 'bye' }); } catch {} setTimeout(() => conn.close(), 300); }
  }

  // =========================================================
  //                        ЗРИТЕЛЬ
  // =========================================================
  function connectTo() {
    const target = digits($('targetInput').value);
    if (target.length < 6 || target.length > 9) { setMsg('enterId', true); return; }
    if (target === myId) { setMsg('ownId', true); return; }
    if (hostConn || viewConn) { setMsg('finishFirst', true); return; }

    viewTarget = target;
    setMsg('waiting');
    $('connectBtn').disabled = true;

    const conn = peer.connect(PREFIX + target, { reliable: true });
    viewConn = conn;

    viewTimer = setTimeout(() => failView('noAnswer'), REQUEST_TIMEOUT_MS);

    conn.on('open', () => conn.send({ type: 'request', mode: 'view' }));
    conn.on('data', msg => {
      if (!msg || typeof msg !== 'object' || conn !== viewConn) return;
      switch (msg.type) {
        case 'accepted': setMsg('accepted'); break;
        case 'rejected': failView('rejected'); break;
        case 'busy':     failView('busy'); break;
        case 'error':    failView(I18N.en[msg.code] ? msg.code : 'peerErr'); break;
        case 'bye':      endViewing('hostEnded'); break;
      }
    });
    conn.on('close', () => { if (conn === viewConn) endViewing('closed'); });
  }

  function onIncomingCall(call) {
    // Принимаем видео только от того, к кому сами подключались
    if (!viewConn || call.peer !== PREFIX + viewTarget) { call.close(); return; }
    viewCall = call;
    call.answer();
    watchIce(call, () => { if (call === viewCall) failView('iceFailed'); });
    stopViewStats();
    stopViewStats = startStats(call, $('viewStats'), 'in');
    call.on('stream', stream => {
      clearTimeout(viewTimer);
      const v = $('remoteVideo');
      $('videoWait').classList.remove('hide');
      v.srcObject = stream;
      v.play().catch(() => {});
      // «Поток» приходит ещё до того, как соединение реально установлено — ждём первый кадр
      viewTimer = setTimeout(() => { if (call === viewCall && !v.videoWidth) failView('iceFailed'); }, VIDEO_TIMEOUT_MS);
      v.onloadeddata = () => { clearTimeout(viewTimer); $('videoWait').classList.add('hide'); };
      viewerParams = { id: fmt(viewTarget) };
      $('viewerTitle').textContent = t('screenOf', viewerParams);
      $('viewer').classList.add('show');
      setMsg('');
    });
    call.on('close', () => { if (call === viewCall) endViewing('showEnded'); });
    call.on('error', () => { if (call === viewCall) endViewing('videoErr', true); });
  }

  function failView(key) { endViewing(key, true); }

  // Диагностика раз в секунду: тип соединения (direct/stun/turn), состояние ICE, разрешение, fps, скорость.
  // Если fps > 0, а картинка чёрная — проблема в захвате экрана на стороне хоста, а не в сети.
  function startStats(call, el, dir) {
    const pc = call.peerConnection;
    if (!pc) return () => {};
    let lastBytes = 0, lastTs = 0;
    const kinds = { host: 'direct', srflx: 'stun', prflx: 'stun', relay: 'turn' };
    const timer = setInterval(async () => {
      try {
        const stats = await pc.getStats();
        let rtp = null, pair = null, cands = {};
        stats.forEach(s => {
          if (s.type === (dir === 'in' ? 'inbound-rtp' : 'outbound-rtp') && s.kind === 'video') rtp = s;
          if (s.type === 'candidate-pair' && (s.selected || (s.nominated && s.state === 'succeeded'))) pair = s;
          if (s.type === 'local-candidate' || s.type === 'remote-candidate') cands[s.id] = s;
        });
        const parts = [pc.iceConnectionState];
        if (pair) {
          const l = cands[pair.localCandidateId], r = cands[pair.remoteCandidateId];
          const k = [l, r].some(c => c && c.candidateType === 'relay') ? 'turn'
                  : kinds[(l && l.candidateType) || ''] || '?';
          parts.push(k);
        }
        if (rtp) {
          const bytes = dir === 'in' ? rtp.bytesReceived : rtp.bytesSent;
          const kbps = lastTs ? Math.round((bytes - lastBytes) * 8 / (rtp.timestamp - lastTs)) : 0;
          lastBytes = bytes; lastTs = rtp.timestamp;
          if (rtp.frameWidth) parts.push(rtp.frameWidth + '×' + rtp.frameHeight);
          parts.push((rtp.framesPerSecond || 0) + ' fps', kbps + ' kbit/s');
        }
        el.textContent = parts.join(' · ');
      } catch {}
    }, 1000);
    return () => { clearInterval(timer); el.textContent = ''; };
  }
  let stopHostStats = () => {}, stopViewStats = () => {};

  // Следим за состоянием WebRTC-соединения: 'failed' — сети не смогли соединиться
  function watchIce(call, onFail) {
    const pc = call.peerConnection;
    if (!pc) return;
    pc.addEventListener('iceconnectionstatechange', () => {
      console.log('ICE state:', pc.iceConnectionState);
      if (pc.iceConnectionState === 'failed') onFail();
    });
  }

  function endViewing(key, isErr) {
    clearTimeout(viewTimer);
    stopViewStats(); stopViewStats = () => {};
    const conn = viewConn, call = viewCall;
    viewConn = null; viewCall = null; viewTarget = null;
    if (conn) { try { conn.send({ type: 'bye' }); } catch {} setTimeout(() => conn.close(), 300); }
    if (call) try { call.close(); } catch {}
    $('remoteVideo').srcObject = null;
    $('viewer').classList.remove('show');
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    $('connectBtn').disabled = !(peer && peer.open);
    setMsg(key, isErr);
  }

  // ---- Обработчики интерфейса ----
  $('copyBtn').onclick = async () => {
    try { await navigator.clipboard.writeText(myId); $('copyBtn').textContent = t('copied'); }
    catch { $('copyBtn').textContent = t('copyFail'); }
    setTimeout(() => $('copyBtn').textContent = t('copy'), 1500);
  };
  $('targetInput').addEventListener('input', e => {
    e.target.value = fmt(digits(e.target.value).slice(0, 9));
  });
  $('targetInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !$('connectBtn').disabled) connectTo(); });
  $('connectBtn').onclick = connectTo;
  $('acceptBtn').onclick = acceptRequest;
  $('rejectBtn').onclick = rejectRequest;
  $('stopShareBtn').onclick = endHosting;
  $('disconnectBtn').onclick = () => endViewing('youLeft');
  $('fsBtn').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else $('viewer').requestFullscreen().catch(() => {});
  };
  window.addEventListener('beforeunload', () => { endHosting(); endViewing(); if (peer) peer.destroy(); });

  // ?id=123456789 в ссылке — сразу подставить номер
  const pre = digits(new URLSearchParams(location.search).get('id'));
  if (pre) $('targetInput').value = fmt(pre.slice(0, 9));

  applyLang();
  const saved = store.get('rview-id');
  loadIceServers().then(list => {
    iceServers = list;
    start(saved && /^[1-9]\d{8}$/.test(saved) ? saved : newId());
  });
})();
</script>
</body>
</html>
